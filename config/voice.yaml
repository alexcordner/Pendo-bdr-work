# Thresholds for the token-overlap tests (0 to 1).
fact_overlap_min: 0.6         # share of a FACT line's words found in one packet fact
trigger_overlap_min: 0.5      # share of a TRIGGER line's words found in the packet trigger evidence
disliked_similarity_min: 0.7  # Jaccard against alex_examples.disliked_openers
