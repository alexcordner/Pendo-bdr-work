# Words that may stand in for each other when the packet's own wording differs (joined for appointed). A word is
# supported when any member of its group is in the packet. Opposites (ended, cancelled) are NOT in these groups.
event_synonym_groups:
  - "appointed, appointment, named, joined, joins, promoted, promotion, started"
  - "hiring, hired"
  - "raise, raised, raising, funding, funded, series, round, seed"
  - "launch, launched, launches, launching, rollout, rolled out, rolling out, shipped, went live"
  - "acquired, acquires, acquisition, merger, merged, merging, bought, takeover"
  - "partnership, partnered"
  - "expansion, expanding"

