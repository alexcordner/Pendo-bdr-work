# Present-progressive or just-happened news phrasing. With NO real trigger, a sentence that uses it AND shares two or
# more content words with a stale, future or intent signal in the packet is presenting old or private data as news.
news_phrasing_patterns:
  - '\b(is|are|was|were|has been|have been) (migrating|launching|rolling|rebuilding|acquiring|hiring|expanding|raising|replacing|moving|building|researching|investing|planning|looking|exploring|buying)\b'
  - '\bjust (announced|launched|raised|appointed|hired|acquired|signed|started|released|opened)\b'
  - '\b(announced|announces|announcing|unveiled|unveils)\b'

