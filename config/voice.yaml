# Voice rules for openers, facts, gatekeeper lines and "just tried you" email drafts.
# Enforced deterministically by src/textcheck.py. Explained in docs/voice_guide.md.
#
# VALIDATED AT LOAD: every key below is required, no other key is allowed (a typo raises VoiceConfigError), and the
# types are checked (calibrated must be a real true/false). Never remove a key to "turn a rule off": empty its list.
#
# Source of the rules: skills/*/SKILL.md and the call-length data in docs/connector_notes.md (about two-thirds of
# Alex's calls last under 10s, about a quarter pass 30s). Anything marked INFERRED extends a rule the skills state
# in general terms and is NOT Alex's confirmed taste. INFERRED lists are SOFT (warnings) unless the phrase is
# unambiguous. Regexes are Python, case-insensitive. Single quotes in YAML keep backslashes literal.
# Phrase lists: whole words, case/space/hyphen-insensitive; a trailing * on a word allows inflections (leverag*).

# While false, every generated opener block / email body MUST start with the label line below.
# Flip to true ONLY after Alex has supplied alex_examples and approved a tuned run (task 2e).
calibrated: false
draft_style_label: "DRAFT STYLE: not yet calibrated to Alex"

# TODO (task 2e, needs Alex): fill these with his real examples. Do not invent any.
# The checker reads disliked_openers (near-duplicates are warned). The Claude session reads all three once calibrated.
alex_examples:
  liked_openers: []      # TODO Alex: 3 openers he likes
  disliked_openers: []   # TODO Alex: 3 openers he hates
  proud_emails: []       # TODO Alex: 2 emails he is proud of

opener:
  max_words: 25            # spoken in about 8 seconds (skill: "max ~25 words")
  max_questions: 1         # one ask. A question mark counts as one ask; so does a cue below in a sentence without one
  ask_cues:
    - '\b(can|could|may) i\b'
    - '\bmind if\b'
    - '\bis it (ok|okay|fine|alright) if\b'
    - '\bare you free\b'
    - '\bdo you have a (minute|second|moment)\b'
    - '\bor (should|shall|can|could|would|do|will) (i|we|you)\b'
    - '\bon your (calendar|diary)\b|\b(book|grab|get|find|carve out|set aside) [^.?!]{0,20}\b(time|minutes?|a slot|a call|a chat|a meeting)\b'
    - '\b(minutes?|mins?)\b[^.?!]{0,25}\b(this week|next week|tomorrow|today)\b'
gatekeeper:
  max_words: 14            # skill: "under 15 words"
  role_cues:               # it must ask for a role / person, not a name
    - who
    - whoever
    - whom
    - person
    - someone
    - anyone
    - head
    - lead
    - manager
    - owner
    - team
    - director
    - looks after
    - responsible
  # Clear pitch language only (skill: "no pitch"). Everyday words (help, free, software, our) are NOT pitch.
  pitch_patterns:
    - '\bwe (help|offer|provide|build|make|sell|work with|do)\b'
    - '\bour (platform|software|product|solution|tool|tooling|service|customers|clients)\b'
    - '\bfree trial\b'
    - '\b(demo|pitch)\b'
    - '\b(analytics|feedback|adoption|engagement|onboarding|survey|nps)[ -](tool|tooling|platform|software|solution)'
    - '\btooling\b'
    - '\banalytics\b'
    - '\bfree (report|guide|trial|demo|audit|assessment|ebook|whitepaper)\b'
    - '\babout (product |user |customer )?(analytics|adoption|engagement|feedback|onboarding|churn|retention)\b'
    - '\b(save|saves|saving|increase|increases|improve|improves|reduce|reduces) (them|you|your|time|costs?|churn|adoption)\b'
  soft_pitch_words:        # INFERRED: may be pitch, may be ordinary English (warning only)
    - adoption
    - platform
    - solution

email:
  subject_min_words: 2     # skill: "2-5 words"
  subject_max_words: 5
  body_max_words: 79       # skill: "under 80 words" (counts greeting and sign-off too)
  content_lines_min: 3     # skill: "3 to 5 short lines" (greeting and sign-off not counted)
  content_lines_max: 5
  opening: "Just tried you"
  signoff: "Alex"
  allow_links: false       # skill: "no links except where Alex asks"
  # Asks: each question mark is one; a sentence with no question mark that holds a cue is one; a sentence with
  # several cues ("can you X, or would you Y") counts each. So "Who owns it? Let me know." is two asks.
  ask_cues:
    - '\blet me know\b'
    - '\bplease (reply|respond|call|email)\b'
    - '\b(reply|respond) (to|with)\b'
    - '\bsend me\b'
    - '\bcall me\b'
    - '\bhappy to (chat|talk|jump|find|catch)\b'
    - '\b(can|could|would|will) you\b'
    - '\bare you (open|free|available|keen)\b'
    - '\bdo you want\b'
    - '\bmind if\b'
    - '\b(can|could|may) i\b'
    - '\bcan we\b'
    - '\bor (should|shall|can|could|would|do|will) (i|we|you)\b'

# Truly banned (the skills name them or they are the same family). Inflections via *.
banned_phrases:
  - "pick your brain"
  - "hoping you"
  - "wish you well"
  - "hope you"                 # hope you're well, hope you are well, hope you're having a great week
  - "hope this*"               # hope this finds you well, hope this email ...
  - "i'm reaching out"
  - "i am reaching out"
  - "reach* out"
  - "quick call"
  - "touch* base"
  - "circl* back"
  - "just checking in"
  - "check* in on"
  - "synerg*"
  - "leverag*"
  - "game-chang*"
  - "revolution*"
  # INFERRED from "no hype words" (same family, error because they are unambiguous marketing hype):
  - "cutting-edge"
  - "best-in-class"
  - "world-class"
  - "next-gen*"
  - "unlock*"
  - "supercharg*"
  - "disrupt*"
  - "transformative"
  - "amazing"
banned_phrases_email_only:
  - "quick"                    # skill: no "quick" in the email
  - "attach*"

# INFERRED. The opener never names a Pendo feature (skill). Clear multi-word feature phrases are errors; one
# ordinary word that may be feature talk is a warning. A phrase that appears in the packet (the account's own
# business) is exempt.
pendo_feature_phrases:
  - "in-app guide*"
  - "in-app"
  - "session replay*"
  - "heatmap*"
  - "walkthrough*"
  - "product analytics"
  - "resource center"
  - "onboarding checklist*"
  - "checklist*"
  - "recordings of"
  - "user session*"
  - "drop-off"
  - "feature adoption"
  - "user segmentation"
pendo_feature_soft_words:
  - "analytics"
  - "funnel*"
  - "nps"
  - "survey*"
  - "guide*"
  - "recordings"

# Claims about Pendo's results, customers or the account's growth that the packet can never support.
unsupported_claim_patterns:
  - '\bwe help\b'
  - '\bpendo (is|helps|gives|lets|makes|shows|tells|enables|provides)\b'
  - '\b(the |a )?(leading|number one|best|top)\b[^.?!]{0,30}\b(platform|tool|solution|vendor|provider)\b'
  - '\bwe (make|build|offer|provide|sell|solve|fix|work with|specialise|specialize|power|enable|improve|increase|reduce|cut|boost|grow|lift|drive|speed up|save|simplify|streamline|deliver|measure|track|analyse|analyze)\b'
  - '\bcompanies like (yours|you)\b'
  - '\b(customers|clients|insurers|banks|teams|businesses|companies) (like|such as)\b'
  - '\bour (customers|clients)\b'
  - '\bour (platform|product|software|tool|solution|approach|technology)\b'
  - '\b(customers|teams|companies|clients) (using|on|with) pendo\b'
  - '\bpendo (customers|clients|users)\b'
  - '\b(use|rely on|trust) (us|pendo)\b'
  - "\\bwe(?:'ve| have) helped\\b"
  - '\b(increase|increases|increased|increasing|reduce|reduces|reduced|reducing|improve|improves|improved|improving|boost|boosts|boosted|cut|cuts) [\w ]{0,20}by\b'
  - '\b(see|get|gain|achieve|enjoy)\b[^.?!]{0,30}\b(higher|more|fewer|less|faster|better|dramatically|half)\b'
  - '\bcut\b[^.?!]{0,40}\bhalf\b'
  - '\b(more|fewer|less|higher|lower) (adoption|tickets|churn|retention)\b'
  - '\bcase stud(y|ies)\b'
  - '\b(proven|trusted by)\b'
  - '\b\d+\s?x\b'
  - '\b(other|similar) (apac|anz|australian|nz|new zealand) (companies|teams|businesses)\b'
  - '\b(growing|expanding|scaling) (fast|quickly|rapidly)\b'
  - '\b(rapid|fast)[ -]growth\b|\bfast-growing\b'
  - '\bgrowing \d'
  - '\b(at the )?top of the (store|charts?|list|market)\b|\bnumber one\b|\b(market|industry) leader\b|\bbest-selling\b'
  - "\\byou(?:'ve| have)? (?:just )?(moved|joined|started|been promoted|were promoted|got promoted|took over|stepped up)\\b"
  - '\b(your|the) (promotion|new role|new job|new position)\b|\byour appointment\b'

# Reactions to news: need a real, usable trigger in the packet (intent signals are NOT a trigger).
trigger_reaction_patterns:
  - '\bcongrat\w*'
  - '\b(saw|noticed|spotted|came across)\b'
  - '\b(read|seen) (that|about)\b|\bheard\b'
  - '\b(big|huge|exciting|busy|massive) (week|news|day|month|time)\b'
  - '\bon a roll\b'
  - '\bi hear\b|\bi heard\b|\bword is\b|\bapparently\b'
