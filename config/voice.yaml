# Round / stage details that must appear verbatim in the packet (Series A is not Series B, seed is not Series A).
round_patterns:
  - '\b(series|round) [a-e]\b'
  - '\bpre-?seed\b'
  - '\bseed\b'
  - '\bipo\b'
  - '\bbridge round\b'

# When the packet flags an ambiguous role, the text must not assume what the contact does.
# (A question like "Do you own that area?" is not an assumption, hence the lookbehinds.)
role_assumption_patterns:
  - '\bas (the|a|an|their) \w+'
  - '\b(in )?your role\b'
  - '(?<!\bdo )(?<!\bdoes )(?<!\bdid )(?<!\bif )(?<!\bwho )(?<!\bwhether )\byou (lead|run|manage|own|head|oversee|look after|handle|care about|are responsible)\b'
  - '\bresponsible for\b'
  - '\byour (team|department|function)\b'

# Send / attach / invite language is banned in ALL generated text (openers, gatekeeper lines, emails): drafts only.
send_language_patterns:
  - '\b(i|we)(?:\x27ve| have|\x27ll| will|\x27m| am)? ?(just )?(sent|send|sending|emailed|emailing|forwarded)\b'
  - '\bsend(ing)? (you|over|through|across|them|him|her)\b'
  - '\bsent (you|this|from|via|by|over)\b'
  - '\b(i|we)(\x27ll| will)? ?forward\b'
  - '\battach(ed|ment|ments|ing)\b'
  - '\b(calendar )?invite\b'
  - '\bsend (this|it|now)\b'
  - '\bsending (this|it|now)\b'
  - '\bauto-?send\b'
  - '\[send\]'

# Claims of earlier contact. Never allowed in the opener (the call history is not opener material). In an email they
# need the packet's contact_history to contain the key word.
history_claim_patterns:
  - '\bwe (spoke|talked|chatted|met|connected)\b'
  - '\b(spoke|talked|chatted) (to|with) you\b'
  - '\bleft (you )?a (voicemail|message|vm)\b'
  - '\b(as|like) (we )?(discussed|agreed|promised)\b'
  - '\bour (last |recent |earlier |previous )?(call|chat|conversation|catch-?up)\b'
  - '\b(following|further to) (up|our|on)\b'
  - '\blast (week|time|month) (we|i)\b'

